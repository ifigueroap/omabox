# Default Omabox services. `omabox init` copies this to
# ~/.config/omabox/services.toml when that file does not exist yet.
# Zulip has no public URL of its own; set one with:
#   omabox add zulip --url https://your-org.zulipchat.com --update

[[service]]
id = "whatsapp"
name = "WhatsApp"
url = "https://web.whatsapp.com/"
icon = ""
profile = "WhatsApp"
key = "1"
unread = "^\\((\\d+)\\)"

[[service]]
id = "slack"
name = "Slack"
url = "https://app.slack.com/"
icon = ""
profile = "Slack"
key = "2"
